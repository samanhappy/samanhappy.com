services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_WECHAT_URL: ${NEXT_PUBLIC_WECHAT_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
